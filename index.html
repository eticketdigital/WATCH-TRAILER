<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ULTRA CINEMATIC TRAILER</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:'Orbitron',sans-serif;
}

/* ============================= */
/* VIDEO BACKGROUND */
/* ============================= */

#bgVideo{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-10;
    filter:brightness(40%);
}

/* ============================= */
/* DARK OVERLAY */
/* ============================= */

.overlay{
    position:fixed;
    inset:0;
    background:
    radial-gradient(circle at center,
    rgba(255,0,0,0.15),
    rgba(0,0,0,0.88));
    z-index:-9;
}

/* ============================= */
/* MOVING LIGHT EFFECT */
/* ============================= */

.lights::before,
.lights::after{
    content:"";
    position:absolute;
    width:700px;
    height:700px;
    border-radius:50%;
    filter:blur(120px);
    animation:moveLight 10s infinite alternate;
}

.lights::before{
    background:rgba(255,0,0,0.35);
    top:-200px;
    left:-200px;
}

.lights::after{
    background:rgba(0,120,255,0.35);
    bottom:-200px;
    right:-200px;
}

@keyframes moveLight{
    from{
        transform:translate(0,0);
    }
    to{
        transform:translate(120px,80px);
    }
}

/* ============================= */
/* PARTICLES */
/* ============================= */

.particles{
    position:absolute;
    width:100%;
    height:100%;
    overflow:hidden;
    z-index:-8;
}

.particles span{
    position:absolute;
    display:block;
    background:white;
    border-radius:50%;
    animation:float 12s linear infinite;
    opacity:0.7;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(0);
    }
    to{
        transform:translateY(-10vh) scale(1);
    }
}

/* ============================= */
/* MAIN CONTENT */
/* ============================= */

.container{
    position:relative;
    z-index:10;
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
    color:white;
}

/* ============================= */
/* LOGO */
/* ============================= */

.logo{
    width:220px;
    margin-bottom:25px;
    filter:drop-shadow(0 0 20px red);
    animation:logoZoom 4s infinite alternate;
}

@keyframes logoZoom{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.06);
    }
}

/* ============================= */
/* TITLE */
/* ============================= */

.title{
    font-size:70px;
    font-weight:900;
    line-height:1.1;
    text-transform:uppercase;

    text-shadow:
    0 0 10px white,
    0 0 20px red,
    0 0 40px red;

    animation:fadeUp 2s ease;
}

.subtitle{
    margin-top:20px;
    font-size:20px;
    letter-spacing:4px;
    opacity:0.9;
    animation:fadeUp 3s ease;
}

/* ============================= */
/* COUNTDOWN */
/* ============================= */

.countdown{
    margin-top:40px;
    display:flex;
    gap:15px;
    flex-wrap:wrap;
    justify-content:center;
}

.time-box{
    width:90px;
    height:90px;
    border-radius:20px;
    backdrop-filter:blur(10px);
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.15);

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    box-shadow:0 0 20px rgba(255,0,0,0.25);
}

.time-box h2{
    font-size:28px;
}

.time-box span{
    font-size:11px;
    opacity:0.7;
}

/* ============================= */
/* BUTTONS */
/* ============================= */

.buttons{
    margin-top:45px;
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}

.btn{
    padding:18px 40px;
    border:none;
    border-radius:60px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:0.4s;
    color:white;
    position:relative;
    overflow:hidden;
}

.btn::before{
    content:"";
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.2);
    transition:0.5s;
}

.btn:hover::before{
    left:100%;
}

.watch{
    background:linear-gradient(45deg,#ff0000,#ff7300);
    box-shadow:0 0 30px rgba(255,0,0,0.8);
}

.ticket{
    background:linear-gradient(45deg,#0066ff,#00c3ff);
    box-shadow:0 0 30px rgba(0,120,255,0.8);
}

.music{
    background:linear-gradient(45deg,#00aa55,#00ff99);
    box-shadow:0 0 30px rgba(0,255,120,0.8);
}

.btn:hover{
    transform:scale(1.08);
}

/* ============================= */
/* MODAL TRAILER */
/* ============================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.96);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
    animation:fadeIn 0.4s ease;
}

.modal video{
    width:90%;
    max-width:1000px;
    border-radius:25px;
    box-shadow:0 0 50px rgba(255,255,255,0.2);
}

.close{
    position:absolute;
    top:20px;
    right:35px;
    font-size:45px;
    color:white;
    cursor:pointer;
}

/* ============================= */
/* ANIMATION */
/* ============================= */

@keyframes fadeIn{
    from{
        opacity:0;
    }
    to{
        opacity:1;
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ============================= */
/* MOBILE */
/* ============================= */

@media(max-width:768px){

.title{
    font-size:42px;
}

.subtitle{
    font-size:14px;
}

.logo{
    width:150px;
}

.time-box{
    width:70px;
    height:70px;
}

.time-box h2{
    font-size:20px;
}

.btn{
    width:100%;
}

}

</style>
</head>
<body>

<!-- VIDEO BACKGROUND -->
<video autoplay muted loop playsinline id="bgVideo">
    <source src="trailer.mp4" type="video/mp4">
</video>

<!-- OVERLAY -->
<div class="overlay"></div>

<!-- LIGHT EFFECT -->
<div class="lights"></div>

<!-- PARTICLES -->
<div class="particles" id="particles"></div>

<!-- AUDIO -->
<audio id="bgMusic" loop>
    <source src="intro.mp3" type="audio/mpeg">
</audio>

<!-- CONTENT -->
<div class="container">

    <!-- LOGO -->
    <img src="logo.png" class="logo">

    <!-- TITLE -->
    <div class="title">
        WESTLIFE<br>
        LIVE IN CONCERT
    </div>

    <!-- SUBTITLE -->
    <div class="subtitle">
        OFFICIAL ULTRA CINEMATIC TRAILER
    </div>

    <!-- COUNTDOWN -->
    <div class="countdown">

        <div class="time-box">
            <h2 id="days">00</h2>
            <span>DAYS</span>
        </div>

        <div class="time-box">
            <h2 id="hours">00</h2>
            <span>HOURS</span>
        </div>

        <div class="time-box">
            <h2 id="minutes">00</h2>
            <span>MINUTES</span>
        </div>

        <div class="time-box">
            <h2 id="seconds">00</h2>
            <span>SECONDS</span>
        </div>

    </div>

    <!-- BUTTON -->
    <div class="buttons">

        <button class="btn watch" onclick="openTrailer()">
            ▶ WATCH TRAILER
        </button>

        <button class="btn ticket">
            🎟 BUY TICKET
        </button>

        <button class="btn music" onclick="toggleMusic()" id="musicBtn">
            🔊 MUSIC ON
        </button>

    </div>

</div>

<!-- MODAL -->
<div class="modal" id="trailerModal">

    <div class="close" onclick="closeTrailer()">✕</div>

    <video controls id="trailerVideo">

        <source src="trailer.mp4" type="video/mp4">

    </video>

</div>

<script>

/* ============================= */
/* PARTICLES */
/* ============================= */

const particles =
document.getElementById("particles");

for(let i=0;i<90;i++){

    const span =
    document.createElement("span");

    span.style.left =
    Math.random()*100 + "%";

    span.style.animationDuration =
    (Math.random()*10 + 5) + "s";

    span.style.opacity =
    Math.random();

    span.style.width =
    span.style.height =
    (Math.random()*4 + 2) + "px";

    particles.appendChild(span);
}

/* ============================= */
/* AUTO PLAY MUSIC */
/* ============================= */

document.body.addEventListener("click", function(){

    const music =
    document.getElementById("bgMusic");

    music.play();

}, { once:true });

/* ============================= */
/* TOGGLE MUSIC */
/* ============================= */

const music =
document.getElementById("bgMusic");

function toggleMusic(){

    if(music.paused){

        music.play();

        document.getElementById("musicBtn")
        .innerHTML="🔊 MUSIC ON";

    }else{

        music.pause();

        document.getElementById("musicBtn")
        .innerHTML="🔇 MUSIC OFF";
    }
}

/* ============================= */
/* OPEN TRAILER */
/* ============================= */

function openTrailer(){

    const modal =
    document.getElementById("trailerModal");

    const video =
    document.getElementById("trailerVideo");

    modal.style.display="flex";

    video.play();
}

/* ============================= */
/* CLOSE TRAILER */
/* ============================= */

function closeTrailer(){

    const modal =
    document.getElementById("trailerModal");

    const video =
    document.getElementById("trailerVideo");

    modal.style.display="none";

    video.pause();

    video.currentTime=0;
}

/* ============================= */
/* COUNTDOWN */
/* ============================= */

const targetDate =
new Date("Dec 31, 2026 20:00:00").getTime();

setInterval(()=>{

    const now =
    new Date().getTime();

    const distance =
    targetDate - now;

    const days =
    Math.floor(distance/(1000*60*60*24));

    const hours =
    Math.floor((distance%(1000*60*60*24))
    /(1000*60*60));

    const minutes =
    Math.floor((distance%(1000*60*60))
    /(1000*60));

    const seconds =
    Math.floor((distance%(1000*60))/1000);

    document.getElementById("days")
    .innerHTML = days;

    document.getElementById("hours")
    .innerHTML = hours;

    document.getElementById("minutes")
    .innerHTML = minutes;

    document.getElementById("seconds")
    .innerHTML = seconds;

},1000);

</script>

</body>
</html>
